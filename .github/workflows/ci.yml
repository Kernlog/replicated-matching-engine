name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 93ad765c7b66ab9ce97469ec23a90b15c3a14ee5
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build-test:
    name: build-test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: clang, cxx: clang++-18 }
          - { compiler: gcc, cxx: g++-13 }
    env:
      CXX: ${{ matrix.cxx }}
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.compiler }}-release
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: ctest --preset release

  asan:
    name: asan-ubsan
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-18
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: clang-asan
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  fuzz:
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-18
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: clang-fuzz
      - run: cmake --preset fuzz
      - run: cmake --build --preset fuzz
      - run: build/fuzz/fuzz/decode_fuzz -max_total_time=30 -print_final_stats=1

  tidy:
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: clang-tidy
      - run: cmake --preset release -DRME_BUILD_BENCH=ON -DVCPKG_MANIFEST_FEATURES=bench
      - run: run-clang-tidy-18 -p build/release -quiet

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q clang-format-18
      - run: git ls-files '*.cpp' '*.hpp' | xargs -r clang-format-18 --dry-run --Werror
      - run: tools/check_determinism.sh
